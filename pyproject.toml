[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcheck"
version = "0.3.0"
description = "Local Excel-vs-document matching with optional Tesseract OCR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See LICENSE.md for proprietary terms" }

# Pinned for reproducibility. The core (matching/normalization) is deterministic;
# the web extras expose the same pipeline over a stable JSON contract.
dependencies = [
    "click==8.4.1",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "pdfplumber==0.11.10",
    "rapidfuzz==3.14.5",
    "fastapi==0.138.0",
    "starlette==1.6.0",
    "anyio==4.15.1",
    "pypdfium2==5.13.0",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
# Optional, deterministic OCR fallback for no-text-layer (scanned) PDF pages.
# Tesseract runs locally and uses trained recognition models, without any cloud LLM.
# Reproducibility requires the same engine and language data. The Tesseract *engine*
# binary must also be installed separately via your OS package manager.
ocr = [
    "pytesseract==0.3.13",
    "Pillow>=10,<13",
    "pypdfium2>=4,<6",
]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "reportlab==5.0.0",
    "pytesseract==0.3.13",
    "Pillow>=10,<13",
    "pypdfium2>=4,<6",
]

[project.scripts]
proofcheck = "proofcheck.cli:main"

[tool.setuptools.packages.find]
include = ["proofcheck", "proofcheck.*"]

[tool.setuptools.package-data]
"proofcheck.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
